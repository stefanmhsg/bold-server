# Configuration of the simulation engine

# initialization
mase.init.dataset = data/MidMaze.trig

# Server configuration
mase.server.protocol = ldp
# Transaction trace mode: off, summary headers/rule count, or full per-triple debug diffs
mase.transaction.trace = summary

# Rule execution order
mase.rules.execution.order= unlock*, stigmergy-traffic-increment*, stigmergy-traffic-add*, stigmergy-traffic-new*, move*
