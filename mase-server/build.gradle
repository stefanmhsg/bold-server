plugins {
    id 'java'
    id 'application'
}

group 'org.maze'
version '0.2.0'

//sourceCompatibility = 17
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Testing - Upgrade to JUnit 5 (Jupiter)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5:5.4.1'

    // RDF4J - 5.x (latest stable)
    // Exclude Jetty to avoid conflicts with Jetty 12
    implementation('org.eclipse.rdf4j:rdf4j-storage:5.2.0') {
        exclude group: 'org.eclipse.jetty'
        exclude group: 'org.eclipse.jetty.http2'
    }
    
    // Jetty - Upgrade to 12.x (latest stable, Jakarta EE 11)
    implementation 'org.eclipse.jetty:jetty-server:12.1.4'
    implementation 'org.eclipse.jetty.ee11:jetty-ee11-servlet:12.1.4'
    implementation 'org.eclipse.jetty.ee11.websocket:jetty-ee11-websocket-jakarta-server:12.1.4'
    implementation 'org.eclipse.jetty:jetty-slf4j-impl:12.1.4'
    
    // Jersey - Upgrade to 4.x (Jakarta EE 10/11)
    implementation 'org.glassfish.jersey.containers:jersey-container-servlet:4.0.0'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:4.0.0'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:4.0.0'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:4.0.0'
    
    // ANTLR - Minor update
    implementation 'org.antlr:antlr4:4.13.2'
    
    // SLF4J - Upgrade to 2.x (API only, Jetty provides implementation)
    implementation 'org.slf4j:slf4j-api:2.0.16'
    // Agent-to-Agent A2A (For example agents)
    implementation "io.github.a2asdk:a2a-java-sdk-reference-rest:0.3.3.Final"
}

application {
    mainClass = 'org.maze.Configurator'
}

distributions {
    main {
        contents {
            // copies relevant configuration files to dist folder
            from('data') { into('data') }
            from('query') { into('query') }
            from('.') { include('*.properties') }
            // Extract rules from resources to distribution
            from('src/main/resources/rules') { into('src/main/resources/rules') }
        }
    }
}

tasks.register('runMase', JavaExec) {
    group = 'application'
    description = 'Run the application.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set(application.mainClass)
    environment 'MASE_SERVER_BASE_URI', 'http://127.0.1.1:8080/'
    dependsOn 'installDist'
}

tasks.register('runBobAgent', JavaExec) {
    group = 'application'
    description = 'Run sample dfs agent bob against a running server.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.maze.examples.SampleDfsAgentBob')
    dependsOn 'classes'
}

tasks.register('runCcrsAgent', JavaExec) {
    group = 'application'
    description = 'Run sample ccrs agent against a running server.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.maze.examples.CcrsAgent')
    dependsOn 'classes'
}

tasks.register('runKeyHolderAgent', JavaExec) {
    group = 'application'
    description = 'Run key holder agent with A2A endpoint and maze holding behavior.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.maze.examples.KeyHolderAgent')
    dependsOn 'classes'
}

test {
    useJUnitPlatform()
}