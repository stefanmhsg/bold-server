services:
  mase-server:
    build:
      context: ./mase-server
      dockerfile: Dockerfile
    container_name: mase-server-ccrs
    command: ["bin/mase-server", "--scenario", "scenarios/ccrs"]
    environment:
      MASE_SERVER_BASE_URI: http://127.0.1.1:8080/
    ports:
      - "8080:8080"
      - "8095:8095"

  mase-viewer:
    build:
      context: ./mase-viewer
      dockerfile: Dockerfile
    container_name: mase-viewer-ccrs
    profiles:
      - viewer
    depends_on:
      - mase-server
    environment:
      MASE_SERVER_INTERNAL_HTTP_URL: http://mase-server:8080
      PUBLIC_MASE_SERVER_HTTP_URL: http://localhost:8080
      PUBLIC_MASE_SERVER_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:3000"

  ccrs-agent:
    build:
      context: ./mase-server
      dockerfile: Dockerfile
    environment:
      CCRS_AGENT_DISPATCH_INTERVAL_MS: ${CCRS_AGENT_DISPATCH_INTERVAL_MS:-5000}
      CCRS_AGENT_REQUEST_TIMEOUT_SECONDS: ${CCRS_AGENT_REQUEST_TIMEOUT_SECONDS:-60}
    depends_on:
      - mase-server
    network_mode: "service:mase-server"
    restart: "no"
    command: >
      sh -lc "sleep ${CCRS_AGENT_START_DELAY:-1};
      java -cp '/opt/mase/install/mase-server/lib/*' org.maze.scenarios.ccrs.agents.CcrsAgent"

  keyholder-agent:
    build:
      context: ./mase-server
      dockerfile: Dockerfile
    environment:
      MASE_KEYHOLDER_BIND_HOST: 0.0.0.0
      MASE_KEYHOLDER_PUBLIC_BASE_URL: http://127.0.0.1:8095
    depends_on:
      - mase-server
      - ccrs-agent
    network_mode: "service:mase-server"
    restart: "no"
    command: >
      sh -lc "sleep ${KEYHOLDER_AGENT_START_DELAY:-75};
      java -cp '/opt/mase/install/mase-server/lib/*' org.maze.scenarios.ccrs.agents.KeyHolderAgent"
